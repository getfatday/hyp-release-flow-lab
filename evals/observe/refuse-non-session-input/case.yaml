schema_version: "1.0"
name: observe-refuse-non-session-input
description: >
  Should-NOT-act guard case. The user asks for a session trace over an
  ordinary markdown document. There is no session transcript anywhere; the
  observe skill must refuse (or ask for a transcript) rather than fabricate a
  trace over non-session input.
tags: [observe, modeling, should-not-act, guard]
context:
  scaffold_script: |
    git init -q .
    printf '%s\n' '# Widget project' '' 'A small widget. Nothing here is a recorded agent session.' > README.md
    git add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -qm 'fixture scaffold'
execution:
  prompt: |
    Trace how README.md was worked on: give me the observe-style node-tagged
    trace with token attribution for it.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: ["Read", "Bash", "Glob", "Grep"]
graders:
  - type: file_exists
    name: no-trace-fabricated
    path: "trace.json"
    exists: false
  - type: file_exists
    name: no-model-invented
    path: "operating-model"
    exists: false
expected_outcome: >
  A refusal that explains observe traces recorded session transcripts (JSONL
  with message records and token usage) and asks for one; no trace.json and no
  fabricated token attribution for a plain markdown file.
