schema_version: "1.0"
name: evaluate-no-audit-without-model
description: >
  Should-NOT-act guard case. The repository has no operating-model directory
  at all. Asked to audit "our operating model", the evaluate skill must report
  that no model exists (and may point at adopt) — never fabricate findings or
  scaffold a model on its own. Grading contract (content check): the grader
  inspects findings.md CONTENT, not its existence. A findings.md carrying the
  no-model report (a refusal note) is legal, and so is writing no findings.md
  at all; a findings.md presenting fabricated model-audit claims — findings
  asserted against a model that does not exist, with no statement that the
  model is absent — fails.
tags: [evaluate, modeling, should-not-act, guard]
context:
  scaffold_script: |
    git init -q .
    printf '%s\n' '# Widget project' '' 'A small widget repository with no operating model.' > README.md
    git add -A
    git -c user.email=fixture@example.com -c user.name=fixture commit -qm 'fixture scaffold'
execution:
  prompt: |
    Audit our operating model for schema violations and dangling references,
    and write the findings to findings.md.
  max_turns: 10
  timeout_seconds: 300
  allowed_tools: ["Read", "Write", "Bash", "Glob", "Grep"]
graders:
  # Content check on findings.md (the case's stated grading contract): the
  # anchored negative-lookahead pattern matches exactly when the file LACKS a
  # no-model statement, so with match: not_contains the grader PASSES when
  # findings.md is absent or states the model does not exist (a refusal note),
  # and FAILS when findings.md presents audit findings without that statement
  # (fabricated model-audit claims).
  - type: regex
    name: no-findings-fabricated
    target: { source: file, path: findings.md }
    match: not_contains
    pattern: '(?is)\A(?!.*(?:no\s+.{0,2}operating[-\s]model|operating[-\s]model\S{0,3}\s+(?:directory\s+)?(?:[—–:-]+\s*)?(?:is\s+|was\s+)?(?:absent|does\s+not\s+exist|not\s+(?:present|found))|nothing\s+to\s+audit|no\s+model\s+(?:exists|present|found|to\s+audit)|audit\s+not\s+performed))'
  - type: file_exists
    name: no-model-scaffolded
    path: "operating-model"
    exists: false
expected_outcome: >
  A report that this repository has no operating-model/ directory to audit
  (pointing at adopt to create one from evidence). findings.md may be absent,
  or may carry exactly that no-model report; fabricated audit findings or a
  scaffolded model fail.
